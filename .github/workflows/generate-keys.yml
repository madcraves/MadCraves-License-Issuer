name: Generate License Signing Keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keys:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Ed25519 Keys
        run: |
          node -e "
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const keys = crypto.generateKeyPairSync('ed25519', {
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
          });

          fs.writeFileSync('ACS-License-Private-Key.pem', keys.privateKey);
          fs.writeFileSync('ACS-License-Public-Key.pem', keys.publicKey);
          "

      - name: Upload Generated Keys
        uses: actions/upload-artifact@v4
        with:
          name: MadCraves-License-Keys
          path: |
            ACS-License-Private-Key.pem
            ACS-License-Public-Key.pem
          retention-days: 1
